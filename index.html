<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mortgage Calculator (2025 Edition)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h2>Mortgage Calculator (2025 Edition)</h2>
      <label>Loan Amount (AUD):</label>
      <input type="number" id="loanAmount" placeholder="e.g. 500000" />

      <label>Interest Rate (% Annual):</label>
      <input type="number" id="interestRate" step="0.01" placeholder="e.g. 5.25" />

      <label>Loan Term:</label>
      <select id="loanTerm">
        <option value="15">15 Years</option>
        <option value="20">20 Years</option>
        <option value="25">25 Years</option>
        <option value="30">30 Years</option>
      </select>

      <button onclick="calculateMortgage()">Calculate Monthly Payment</button>
      <div class="result" id="monthlyPayment"></div>

      <div class="ad-slot">[Your Google Ad Code Here]</div>
    </div>

    <div class="right-panel">
      <h3>Articles</h3>
      <ul>
        <li><a href="article2.html">Fixed vs Variable Rates</a></li>
        <li><a href="article3.html">First-Time Buyer Tips</a></li>
        <li><a href="article4.html">Improving Your Credit Score</a></li>
        <li><a href="article5.html">How Pre-Approval Works</a></li>
        <li><a href="article6.html">Saving for a Deposit</a></li>
      </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
